<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 640px;
      padding: 3rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
    }

    p {
      font-size: 1.125rem;
      color: #475569;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.025em;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Hello, World!</h1>
    <p>
      This is a simple, clean webpage built with modern HTML and CSS.
      It uses a centered layout, responsive design, and a minimal color palette
      for a pleasant reading experience on any device.
    </p>
    <span class="badge">Built with care</span>
  </main>
</body>
</html>
